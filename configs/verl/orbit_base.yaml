# Base of every OrbitLM experiment on verl. The recipes (rl_sft_mix.yaml, distill_rl_sft_16k.yaml)
# list it in their defaults and change only what differs. The launcher composes them; the model comes
# from the command line:
#
#   $PY <repo>/scripts/verl/launch.py --config <experiment> --export /path/to/hf/export <overrides>
#
# No file here names a checkpoint or a personal directory. The export, the model dir name and the
# runs root come from the launcher.
#
# The RL recipe follows the RLTT paper (arXiv 2602.10520) done the verl way: RLTT with exit weighting
# whose weights are constants of the loss (the gate is not trained by RL), 8 completions per prompt,
# temperature 0.9, a constant lr of 1e-6 after a linear warmup, weight decay 0.1, Adam betas
# 0.9/0.99, gradient clip 0.1, k3 KL 1e-3 on the final loop, the loss averaged per response and
# then over responses (seq-mean-token-mean, the paper's Eq. 6), fp32 master weights, and one
# optimizer step per batch. docs/verl/DESIGN.md explains where the port differs from the paper's
# reference code and why.
#
# This file has no hydra block on purpose. Hydra accepts hydra.searchpath only in the primary
# config, and here it is an error. The experiments carry the search path, and the launcher passes
# it as an override as well.
defaults:
  - ppo_trainer
  - _self_

# Launcher-facing settings. verl ignores this block; the verl keys below refer to it.
# Keep it in block style: the mandatory marker ??? does not parse inside a {flow: mapping}.
orbit:
  run_name: ???                        # the launcher's default is <config>__<model name>
  # Root of every output and cache: prepared models, datasets, runs, caches. There is no default.
  # The launcher takes --runs-root, else this key, else $ORBIT_VERL_RUNS, and refuses to start
  # without one of them.
  runs_root: null
  run_dir: ${orbit.runs_root}/runs/${orbit.run_name}   # checkpoints, metrics.jsonl, logs
  repo_root: ???                       # set by the launcher to the repo that holds orbit_verl
  prompt_mode: ???                     # the default agent loop's mode; see orbit_verl.data.prompts
  model_dir: ${orbit.runs_root}/models/${orbit.prepare.model.name}
  data_dir: ${orbit.runs_root}/data/${orbit.prepare.data.name}
  # The model lineages this experiment makes sense for, as the prepared model dir records them
  # (release_qwen3 or unknown, see orbit_verl.model.prepare_model). null means any lineage.
  # The pre-flight refuses a model dir of another lineage and prints the reason in "why".
  fits:
    lineages: null
    why: null
  prepare:
    # Arguments of orbit_verl.model.prepare_model, used by --prepare and printed by the checks.
    model:
      export: ???                      # HF export dir; the launcher's --export sets it
      name: ???                        # the prepared dir is <runs_root>/models/<name>; derived from the export
      preset: auto                     # the tokenizer family: auto picks qwen3 for vocab 151936
      max_position_embeddings: null    # null keeps the export's value
      materialize_weights: false       # true copies the weights, for nodes that cannot read the export
    # Arguments of orbit_verl.data.prepare_data, the single-mode builder that the pass-rate tool
    # uses. The recipes set builder: distill and use the keys of orbit_verl.data.distill_data.
    # Either builder takes its max_prompt_length from data.max_prompt_length.
    data:
      # A local jsonl or parquet file.
      src: ???
      # The dataset dir is <runs_root>/data/<name>. Experiments end the name with
      # __${orbit.prepare.model.preset}, because the length filter counted that tokenizer's tokens.
      name: ???
      prompt_mode: ${orbit.prompt_mode}
      data_source: null                # null: the prompt mode's default
      question_field: instruction      # field names of the source files
      answer_field: response
      val_size: 64                     # rows held out from src for val.parquet
      val_src: null
      limit: null                      # keep only this many train rows (smoke sets)
  plugin: true                         # load orbit_verl.plugin in every verl process (needed for rltt_*)
  rltt:
    progressive_alpha: 1.0             # exponent of the rltt_progressive loop weights
    chunk_size: 512                    # tokens per chunk of the per-loop log-prob computation
    # false: rltt_exit weights the loops with the exit pdf as a constant (RLTT paper, Eq. 4), and
    # the RL loss does not train the exit gate. true: the loss trains the gate too, as the RLTT
    # reference code does; its gradient pushes the gate toward loop 0 on every token with a
    # negative advantage (docs/verl/DESIGN.md).
    train_exit_gate: false
    # After every step, a drop of actor/rltt/expected_exit_step by more than this many loops below
    # its first-step value logs orbit/exit_drift_alarm = 1 and prints a WARNING line. Training
    # goes on either way.
    exit_drift_alarm: 0.3
  clearml_env: null                    # dotenv file with CLEARML_* credentials; never copied into the config
  env: {}                              # extra env vars for every Ray process, e.g. NCCL_DEBUG: INFO

data:
  train_files: ${orbit.data_dir}/train.parquet
  val_files: ${orbit.data_dir}/val.parquet
  prompt_key: prompt
  train_batch_size: 128                # prompts per step; the recipes set their own
  max_prompt_length: 768               # must equal the length the dataset was filtered at
  max_response_length: 512
  filter_overlong_prompts: false       # the converter already filtered with the rollout's tokenization
  trust_remote_code: true
  shuffle: true
  dataloader_num_workers: 0

actor_rollout_ref:
  model:
    path: ${orbit.model_dir}
    trust_remote_code: true
    use_remove_padding: true
    enable_gradient_checkpointing: true
    use_fused_kernels: false           # OuroModel returns a tuple; verl's fused forward does not fit
    override_config:
      # Our attention kernel from the hub drops attention_mask and position_ids, which is wrong
      # on verl's packed batches. flash_attention_2 handles them.
      attn_implementation: flash_attention_2
      # The export has threshold 1.0, which sends the plain forward through early-exit selection.
      # null gives the fixed final loop, which is also what vLLM generates with.
      early_exit_threshold: null
      # Never add pad_token_id or embedding_padding_idx here. The prepared model dir records which
      # embedding row the model's training kept frozen (none for the release models), and the
      # launcher refuses both keys.
      # Do not nest keys under a model_config block either: verl applies that block instead of
      # the keys above, and the launcher refuses it.
  actor:
    strategy: fsdp                     # FSDP1; fsdp2 was not evaluated
    # One optimizer step per batch. verl counts this in prompts and multiplies it by rollout.n, so
    # every update sees all completions of the step.
    ppo_mini_batch_size: ${data.train_batch_size}
    ppo_epochs: 1
    shuffle: false
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 16384   # at least max_prompt_length + max_response_length; lower it on OOM
    use_kl_loss: true
    kl_loss_type: low_var_kl           # k3 on the final loop, as in the RLTT paper
    kl_loss_coef: 1.0e-3               # the RLTT paper's value
    entropy_coeff: 0.0
    # The mean over each response's tokens, then the mean over the responses (RLTT paper, Eq. 6).
    # Every response weighs the same, so a long response does not outweigh a short one.
    loss_agg_mode: seq-mean-token-mean
    policy_loss:
      loss_mode: rltt_exit             # vanilla is stock final-loop GRPO; rltt_* need orbit.plugin
    optim:
      lr: 1.0e-6                       # the RLTT reference value; fp32 master weights keep updates this small
      # A linear warmup over the first 10% of trainer.total_training_steps, then a constant lr, as
      # in the RLTT paper. lr_warmup_steps -1 makes verl use the ratio. The schedule counts steps
      # from 0, so the first update runs at lr 0.
      lr_scheduler_type: constant
      lr_warmup_steps: -1
      lr_warmup_steps_ratio: 0.1
      weight_decay: 0.1
      betas: [0.9, 0.99]
      clip_grad: 0.1                   # the RLTT paper's max gradient norm
    fsdp_config:
      reshard_after_forward: false     # SHARD_GRAD_OP: each layer runs 4 times per forward
  ref:
    log_prob_max_token_len_per_gpu: 16384   # at least max_prompt_length + max_response_length
  rollout:
    name: vllm
    n: 8                               # completions per prompt (the GRPO group)
    temperature: 0.9
    top_p: 1.0
    top_k: -1
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.5        # share of GPU memory vLLM may take; lower it on OOM
    max_model_len: null                # = max_position_embeddings of the prepared dir
    calculate_log_probs: true
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 16384   # at least max_prompt_length + max_response_length
    # vLLM keeps the rollout KV cache in fp8 instead of bf16. Only the cache changes: the weights
    # stay bf16 in vLLM, and the actor trains exactly as before. OrbitLM keeps a separate KV cache
    # for each of its 4 loops (0.75 MiB per token), so long responses are limited by KV memory and
    # by reading the cache at every step. fp8 halves both: on an H200 it doubled the cache capacity
    # and made RL-like sampling (T 0.9) 1.34x faster. The rollout distribution moves by about
    # 2.7e-3 nats per token, so watch rollout_corr/kl. The fp8 scales stay at 1.0 (no calibration),
    # which verl's wake_up also resets them to. Set it to auto for a bf16 cache.
    engine_kwargs:
      vllm:
        kv_cache_dtype: fp8
    agent:
      num_workers: 8                   # use 2-4 on a node with few CPUs
      default_agent_loop: orbit_${orbit.prompt_mode}
      agent_loop_config_path: ${orbit.repo_root}/configs/verl/agent_loops.yaml
    val_kwargs:
      temperature: 0
      n: 1

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false

critic:
  enable: false                        # GRPO has no critic; saying so explicitly silences verl's warning

reward:
  num_workers: 8                       # use 2-4 on a node with few CPUs, as agent.num_workers
  custom_reward_function:
    path: pkg://orbit_verl.data.reward
    name: compute_score
    reward_kwargs:
      # Reward of a response cut by the length limit, whatever its answer. 0 teaches the model to
      # finish within the budget; null scores such a response on its text like any other.
      truncated_score: 0.0

trainer:
  project_name: OrbitLM                 # the ClearML project, when trainer.logger includes clearml
  experiment_name: ${orbit.run_name}
  nnodes: 1                            # replaced by the launcher
  n_gpus_per_node: 1                   # replaced by the launcher
  total_epochs: 100
  total_training_steps: 140
  save_freq: 20
  test_freq: -1
  val_before_train: false
  logger: [console, file]              # file writes <run_dir>/metrics.jsonl; add clearml if needed
  default_local_dir: ${orbit.run_dir}/ckpt
  resume_mode: auto                    # a relaunch with the same run_name continues from the last checkpoint
  # null keeps every checkpoint, so the best step of a run is still there when a later step is
  # worse. One checkpoint of a release model is about 22 GB.
  max_actor_ckpt_to_keep: null

ray_kwargs:
  ray_init:
    num_cpus: null                     # must stay null when joining an existing cluster
    address: local                     # replaced by the launcher in multi-node mode
    include_dashboard: false
    runtime_env:
      env_vars: {}                     # filled by the launcher with the job env
