# SFT v5 of OrbitLM (stage 5): 32K, response-only loss, document masking, 7000 steps from the final
# 32K export, on chat, reasoning, Russian, tool-use and agent data.
#
# Mix and render: data_prep/sft/versions/v5_smoltalk2.yaml. The version splits the token budget into
# three parts. SmolTalk2 gets 0.70: its SFT splits, both SystemChats splits, and its hermes, xLAM
# and SmolAgents tool splits. The Russian and benchmark additions get 0.15: the ru_sft_* streams,
# T-Wix, Aya-ru, GrandMaster and bench_train, each seen the same number of times. The tool data
# gets 0.15: dolci_tool_use, nemotron_agentic_v2 and nemotron_post_v1. Inside the SmolTalk2 part,
# the OpenThoughts3 think stream has recipe weight 0.06, so that think and no_think stay at about
# 48 / 52 of the assistant tokens; tool-call data is about 6.8% of them.
# Every proportion below is a sampling weight. A SmolTalk recipe weight is converted to
# recipe_weight * packed_tokens, so a recipe weight of 1 means the same number of epochs on every
# split. enable_thinking on each stream of the version selects think or no_think.
# The ru_sft_* streams are Russian SFT chats that you supply, one stream per role (science, math,
# code, dialog, tasks, creative, education, qa_reasoning, summarization); data_prep/README.md
# describes their format.
# The tokenizer is the tools variant of the Qwen3.5-style chat template. data_prep/sft renders the
# shards with it, and its template decides where the loss mask starts. The in-training evaluation
# renders its prompts with the think variant (eval_tokenizer_source below).
#
# The chat export of step 7000 (python -m orbit.export --chat-export with the tools tokenizer,
# written to ${ORBIT_EXPORTS}/sft_v5_step7000) starts the distillation and RL stages.
#
# A step is 64 sequences of 32768 tokens (batch_size 1 on 64 GPUs, or grad_accum 2 on 32).
# 14,680,064,000 tokens are 7,000 steps of 2,097,152 tokens, and the cosine runs over all of them.
# The version file plans 10B tokens; the run trained this larger budget on purpose, and the epochs
# in the proportion comments below are those of this budget.
# A run must log document_masking=1 boundary_token_id=151643.
# The ${...} variables are described in src/orbit/README.md.
save_dir: ${ORBIT_RUNS}
run_name: orbit_sft_v5
auto_resume: true
init_from_hf: ${ORBIT_EXPORTS}/stage4_32k_step4769
resume_from: null

detect_nan: true
dump_nonfinite_batch: ${ORBIT_RUNS}/nan_dumps/orbit_sft_v5

