tokenizer_config: ${ORBIT_TOKENIZERS}/tokenizer_qwen3_4b_qwen35_tools/tokenizer_config.json

lr: 1.0e-5
lr_scheduler: warmup_cosine
lr_warmup_steps: 100
lr_warmup_start_lr: null
lr_warmup_start_factor: 0.1
lr_warmup_start_step: auto
lr_cosine_steps: auto
lr_min: 1.0e-6
lr_min_factor: 0.1
beta: 0.15
seq_len: 32768
total_ut_steps: 4
rope_theta: 4000000.0

dtype: bf16
attn_impl: kernels-community/vllm-flash-attn3
float32_matmul_precision: highest
fsdp_sharding_strategy: shard_grad_op
fsdp_reduce_dtype: fp32
fsdp_buffer_dtype: fp32
gradient_checkpointing: true
document_masking: true

tokens_per_step: 2097152
token_budget: 14680064000

batch_size: 1
grad_accum: null
num_workers: 0
prefetch_factor: 2
loader_timeout: 0.0
predownload: null
cache_limit: null
seed: 46
model_init_seed: 271828

