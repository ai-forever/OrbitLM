# Smoke test of the 4K pretraining stage on one GPU: random init, 5 steps, two streams.
#
# Parent: configs/train/pretrain/stage1_4k.yaml. This file is a copy of it with these keys changed
# (tests/train/test_release_configs.py checks that nothing else differs): run_name, auto_resume
# false, batch_size 2 and tokens_per_step 8192 (two sequences of 4096, grad_accum 1 on one GPU),
# two of the parent's streams (one under stage1_root, one at its own path), max_steps 5, and
# clearml_enabled false written out. The run saves a checkpoint after step 5.
# The stream at its own path is ru_web, the Russian web text that you supply, so the smoke needs
# that folder too (data_prep/README.md).
save_dir: ${ORBIT_RUNS}
run_name: smoke_pretrain_4k

auto_resume: false
init_from_hf: null
resume_from: null

detect_nan: true
dump_nonfinite_batch: ${ORBIT_RUNS}/nan_dumps

model_config: ../../../src/orbit/ouro_1.4b_qwen3_config.json
tokenizer_config: ${ORBIT_TOKENIZERS}/tokenizer_qwen3_orbit/tokenizer_config.json

lr: 3e-4
lr_scheduler: warmup_cosine
lr_warmup_steps: 1000
lr_warmup_start_lr: null
lr_warmup_start_factor: 0.1
lr_warmup_start_step: auto
lr_cosine_steps: auto
lr_min: 3e-5
lr_min_factor: 0.1

beta: 0.15
seq_len: 4096
total_ut_steps: 4
rope_theta: 40000.0

dtype: bf16
attn_impl: kernels-community/vllm-flash-attn3
float32_matmul_precision: highest
fsdp_sharding_strategy: shard_grad_op
fsdp_reduce_dtype: fp32
fsdp_buffer_dtype: fp32
gradient_checkpointing: true

tokens_per_step: 8192
token_budget: 419430400000

batch_size: 2
grad_accum: null
num_workers: 0
prefetch_factor: 2
loader_timeout: 0.0
predownload: null
cache_limit: null
seed: 44
model_init_seed: 271828
stage1_root: ${ORBIT_DATA}/pretrain_4k/en
stage1_epoch_samples: 1000000000
stage1_mixing_mode: mosaic_random
stage1_shuffle: true
stage1_shuffle_seed: 44
stage1_shuffle_block_size: 10737418
stage1_num_canonical_nodes: null
stage1_token_dtype: uint32
stage1_streams:
  nemotron_cc_high: nemotron-cc
  ru_web: ${ORBIT_DATA}/pretrain_4k/ru/web

stage1_dataset_proportions:
  nemotron_cc_high: 0.665
  ru_web: 0.395224

strict_dataloader_determinism: true
weight_decay: 0.1
max_grad_norm: 1.0
lm_loss_chunk_size: 128
use_fused_adamw: true
log_every: 1
save_every: 1000
tensorboard_root: ${ORBIT_RUNS}/tensorboard
max_steps: 5
clearml_enabled: false
