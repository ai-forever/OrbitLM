# Smoke test of the 16K context-extension stage on one GPU: init_from_hf, document masking, 3 steps.
#
# Parent: configs/train/pretrain/stage3_16k.yaml. This file is a copy of it with these keys changed
# (tests/train/test_release_configs.py checks that nothing else differs): run_name, auto_resume
# false, batch_size 1 and tokens_per_step 16384 (one sequence of 16384, grad_accum 1 on one GPU),
# two of the parent's streams, max_steps 3, and clearml_enabled false written out.
# init_from_hf stays the parent's (the 4K export); any base export of the 1.4B model works.
# The log must show "document_masking=1 boundary_token_id=151643".
save_dir: ${ORBIT_RUNS}
run_name: smoke_context_16k

auto_resume: false
init_from_hf: ${ORBIT_EXPORTS}/stage2_4k_step200000
resume_from: null

detect_nan: true
dump_nonfinite_batch: ${ORBIT_RUNS}/nan_dumps

model_config: ../../../src/orbit/ouro_1.4b_qwen3_config.json
tokenizer_config: ${ORBIT_TOKENIZERS}/tokenizer_qwen3_orbit/tokenizer_config.json

lr: 2e-5
lr_scheduler: warmup_cosine
lr_warmup_steps: 500
lr_warmup_start_lr: null
lr_warmup_start_factor: 0.1
lr_warmup_start_step: auto
lr_cosine_steps: auto
lr_min: 2e-6
lr_min_factor: 0.1

beta: 0.15
seq_len: 16384
total_ut_steps: 4
rope_theta: 1000000.0

dtype: bf16
attn_impl: kernels-community/vllm-flash-attn3
float32_matmul_precision: highest
fsdp_sharding_strategy: shard_grad_op
fsdp_reduce_dtype: fp32
fsdp_buffer_dtype: fp32
gradient_checkpointing: true

document_masking: true

tokens_per_step: 16384
token_budget: 200000000000

batch_size: 1
grad_accum: null
num_workers: 0
prefetch_factor: 2
loader_timeout: 0.0
predownload: null
cache_limit: null
seed: 44
model_init_seed: 271828
stage1_root: ${ORBIT_DATA}/ctx16k/streams
stage1_epoch_samples: 1000000000
stage1_mixing_mode: mosaic_random
stage1_shuffle: true
stage1_shuffle_seed: 16385
stage1_shuffle_block_size: 10737418
stage1_num_canonical_nodes: null
stage1_token_dtype: uint32

stage1_streams:
  nemotron_cc: nemotron_cc
  ru_wiki: ru_wiki

stage1_dataset_proportions:
  nemotron_cc: 0.290287
  ru_wiki: 0.001501

strict_dataloader_determinism: true
weight_decay: 0.1
max_grad_norm: 1.0
lm_loss_chunk_size: 128
use_fused_adamw: true
log_every: 1
save_every: 1000
tensorboard_root: ${ORBIT_RUNS}/tensorboard
max_steps: 3
clearml_enabled: false
