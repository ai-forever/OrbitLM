# RULER niah_multivalue with a configurable number of samples per length (ruler_local.py). The
# lengths and the sample count come from --metadata '{"max_seq_lengths": [...], "num_samples": N}'.
tag:
  - in_training_eval
task: itr_niah_multivalue
dataset_path: ""
dataset_name: ""
output_type: generate_until
test_split: test
custom_dataset: !function ruler_local.niah_multivalue
doc_to_text: "{{input}}"
doc_to_target: "{{outputs}}"
gen_prefix: "{{gen_prefix}}"
target_delimiter: " "
process_results: !function ruler_local.process_results
metric_list:
  - metric: "4096"
    aggregation: !function ruler_local.aggregate_metrics
    higher_is_better: true
  - metric: "8192"
    aggregation: !function ruler_local.aggregate_metrics
    higher_is_better: true
  - metric: "16384"
    aggregation: !function ruler_local.aggregate_metrics
    higher_is_better: true
  - metric: "32768"
    aggregation: !function ruler_local.aggregate_metrics
    higher_is_better: true
  - metric: "65536"
    aggregation: !function ruler_local.aggregate_metrics
    higher_is_better: true
  - metric: "131072"
    aggregation: !function ruler_local.aggregate_metrics
    higher_is_better: true
generation_kwargs:
  do_sample: false
  temperature: 0.0
  max_gen_toks: 128
  until: []
repeats: 1
metadata:
  version: 1.0
