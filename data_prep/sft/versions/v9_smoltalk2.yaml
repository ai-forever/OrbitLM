# SFT v9. The v8 streams and shards, with a larger tool part. v8 is unchanged.
# Parts are 0.50841 / 0.15 / 0.28922 / 0.05237. addition_tools is 0.28922,
# near v7's 0.286, and tool-call data is 15.0% of assistant tokens at 10B.
# Code is 0.05237, so the code topic stays 35.0% of Reasoning assistant
# tokens. additions stays 0.15. SmolTalk is what remains, 0.50841.
# Reasoning is then 29.5% of assistant tokens, not v7's 24.2%. The additions
# bucket is itself about 29% reasoning, so 25% is not reachable while that
# bucket stays at 0.15 and tools stay at 15%. Both Nemotron sets are recipe
# weight 0.4. ToolMind and Dolci are 1. Inside code every stream has recipe
# weight 1. Shards are symlinks to sft/v8. Nothing is rebuilt.
#
# SFT v6. Same parts and recipe weights as v5. A dialog is dropped when its
# longest reasoning chain is longer than max(floor, the percentile of that
# stream). The percentile is over dialogs that have a chain, after the loop,
# flood and echo filter. The chain is the trimmed text between <think> and
# </think>, or reasoning_content on a tool turn. Markers are not counted, and
# the length is tokens of that text alone. A dialog with no chain is kept.
# --build scans each stream, prints p95 and the threshold, then tokenizes and
# packs. Recipe weights match v5. Sampling weights change after --resolve,
# because the packed token counts shrink.
#
# SFT v5: the mix of the SFT stage (configs/train/sft/sft_v5.yaml). The build
# is written to ${ORBIT_DATA}/sft/v5.
#
# The token budget is split into three parts:
#   smoltalk        0.70  the SmolTalk2 SFT splits and SmolTalk's own tool splits
#   additions       0.15  the nine ru_sft_<role> streams, T-Wix, Aya (Russian
#                         rows), GrandMaster and bench_train
#   addition_tools  0.15  Dolci tool use and the two Nemotron tool-calling samples
# With the weights below, this split puts tool-call data at about 6.8% of
# assistant tokens and keeps think / no_think at about 48 / 52 of assistant
# tokens.
#
# weight on a stream of the two recipe parts (smoltalk and addition_tools) is
# a recipe weight in the sense of the SmolLM3 mixture: the share of that split
# kept in one pass. --resolve turns it into a sampling weight,
# fraction * packed_tokens, so a fraction of 1 means the same number of epochs
# on every split. Most SmolTalk2 splits have weight 1, the whole split once per
# pass, and that includes smoltalk_multilingual8_Qwen3_32B_think and
# smoltalk_smollm3_smol_magpie_ultra_no_think. OpenThoughts3-think has 0.06,
# because with the tool data in the mix that weight keeps the think / no_think
# balance above. OpenThoughts3 no_think has 0.4 and OpenHermes 0.5.
#
# The additions part is packed: every stream in it is seen the same number of
# times. Every part has an epoch_cap of 5. An overrun is printed by --resolve
# and does not shrink the part's fraction.
#
# The nine ru_sft_<role> streams read Russian SFT chats that you supply: one
# messages-format jsonl file per role in ${ORBIT_RAW}/russian_sft/
# (data_prep/README.md gives the format).
#
# Both SystemChats splits are in the smoltalk part at recipe weight 1. These
# dialogs exist to carry a system prompt, and this mix keeps it: a dialog that
# has a system prompt keeps it as a system turn, and that turn is not a
# training target. An optional rewrite table (build.py --rewrite-table FILE)
# replaces the prompts it lists. Every other prompt stays verbatim.
#
# SmolTalk's own tool splits are in the smoltalk part at recipe weight 1, read
# from the converted jsonl (not the original parquet). They are about 0.3% of
# assistant tokens. Dolci, the two Nemotron samples and ToolMind are
# addition_tools. Dolci is no_think and only 16% of its packed tokens are
# assistant tokens, so its recipe weight is 1. The two Nemotron sets are think
# and much denser, so each has weight 0.4, the same as v7: the same number of
# epochs as each other, 0.4 of Dolci's. ToolMind is weight 1. Its trained
# tokens are the last turn, which is a chain; the shared prefix is mask 0.
#   smoltalk_hermes, smoltalk_xlam, dolci_tool_use: no_think
#   smoltalk_smolagents, nemotron_agentic_v2, nemotron_post_v1: think
#   toolmind_open: think, loss on the last assistant turn only
#
# The chat template is data_prep/tokenizer/templates/qwen35_system_tools.jinja,
# in tokenizer_qwen3_4b_qwen35_tools. It is the Qwen3.5 think switch, a system
# turn when the dialog has one, and Qwen3 JSON tool calls. There is no
# last-user-query cut: every assistant turn keeps its chain, except
# toolmind_open, which trains only the last turn.
#   think:    prompt ends at <think>\n; the trace, \n</think>\n\n and the answer are trained.
#   no_think: prompt includes <think>\n\n</think>\n\n; that tail has loss mask 0.
#
# stats_root is the v8 tree, which already has every stream including code
# and ToolMind. out_root holds symlinks to those shards. --resolve reads
# v8 stats. There is no local stats.json.
#
# While --build is running, progress.json in out_root says how many streams
# are tokenized. progress_current.json says how many dialogs of the running
# stream are rendered. Read both with:
#   python data_prep/sft/build.py --version data_prep/sft/versions/v9_smoltalk2.yaml --progress
# During the chain scan the running file says "scanned" rather than "rendered".
#
# OpenThoughts3-think is the SmolTalk2 export. About 700k of its rows have no
# </think>, a generation cutoff that is already present in
# open-thoughts/OpenThoughts3-1.2M. prepare_messages drops a dialog with an
# unclosed <think>, so those rows are left out.

name: v9_smoltalk2
seq_len: 32768
token_budget: 10000000000
min_resp_tokens: 2
tokenizer: ${ORBIT_TOKENIZERS}/tokenizer_qwen3_4b_qwen35_tools
# A dataset system prompt stays its own system turn. The version names no
# rewrite table (rewrite_table: FILE), so every system prompt stays verbatim.
# build.py --rewrite-table FILE applies a table, and collect_system_prompts.py
# writes one from the prompts of the mix; data_prep/README.md
# describes both.
system_turns: true
out_root: ${ORBIT_DATA}/sft/v9
stats_root: ${ORBIT_DATA}/sft/v8

# Drop a dialog whose longest chain is longer than max(floor, this percentile).
chain_filter:
  floor: 8192
  percentile: 95

parts:
  - id: smoltalk
    fraction: 0.50841
    weight_mode: recipe
    epoch_cap: 5
  - id: additions
    fraction: 0.15
    weight_mode: packed
    epoch_cap: 5
  - id: addition_tools
    fraction: 0.28922
    weight_mode: recipe
    epoch_cap: 5
  - id: code
    fraction: 0.05237
    weight_mode: recipe
    epoch_cap: 5

smoltalk_dir: ${ORBIT_RAW}/hf/HuggingFaceTB__smoltalk2/SFT

streams:
  - id: OpenThoughts3_1.2M_think
    part: smoltalk
    kind: smoltalk
    path: ${ORBIT_RAW}/hf/HuggingFaceTB__smoltalk2/SFT/OpenThoughts3_1.2M_think-*.parquet
    weight: 0.06
    enable_thinking: true
  - id: OpenThoughts3_1.2M_no_think_no_think
